<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- 站点图标（阶段 19）：土星 —— 一颗带环的球，与全屏背景同源。内联 SVG，不新增图片文件。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23171a21'/><g transform='rotate(-20 16 16)'><ellipse cx='16' cy='16' rx='13.2' ry='4.1' fill='none' stroke='%239aa4b8' stroke-width='1.7'/><circle cx='16' cy='16' r='6.2' fill='%23cfd6e4'/></g></svg>"
    />
    <title>Graphite Workspace</title>

    <!-- 开屏 JS 预取（CONTRACT §31）：放在 head 里让预加载扫描器最早发现它，
       与主包并行下载；否则 classic script 要等解析到 </body> 才被发现，
       请求顺序全看扫描器心情（探针实测抓到过 main 先于 boot）。 -->
    <link rel="preload" as="script" href="/boot.js" />

    <!-- ============================================================
         首屏「绘制式」加载动画（2026-10-26 00:48 重做：主人要求「不要再放一个现成的球，
         做一个绘制动画，一个土星被一笔笔画出来」）

         ── 为什么是 SVG 描边 + pathLength ──────────────────────
         逐笔绘制的标准做法：把每条路径的长度归一化成 1（`pathLength="1"`），
         `stroke-dasharray: 1` 把整条线变成一段虚线，再用 `stroke-dashoffset: 1 → 0`
         把它「推」出来。好处是与真实路径长度无关 —— 不用为每条线算周长，
         球、环、云带、高光可以用同一套动画。项目里 Dock 图标的描边动画用的就是这招。

         ── 画的顺序（就是人画土星的顺序）────────────────────────
         1. 环的后半段（先定透视）
         2. 球的轮廓
         3. 球内三条云带（宽窄不一，真实土星的带纹不是等宽）
         4. 环的前半段（从球前面穿过去，这一步才「成立」）
         5. 高光弧
         6. 最后统一上色：球体渐变填充淡入、描边退成淡线、外辉亮起
         每笔用 `--d` 错开 0.12~0.18s，总长约 2.1s。

         ── 为什么不用图片 ──────────────────────────────────────
         「提前用 SVG 做一张图再显示」也能出效果，但那就不是绘制动画了。
         这里是真按路径画：JS 没到的几秒里，用户看到的是一个土星正在被画出来，
         而不是一个转圈的球。

         ── 与 WebGL 土星的交接 ──────────────────────────────────
         这一层是「JS 还没到」时的主角。React 挂载、WebGL 出第一帧后，
         splash.ts 会给它加 `is-done` 淡出（**延迟约 900ms**，让画至少被看见），
         然后交给真土星做推近 → 悬停 → 拉远。

         ── 无障碍 ──────────────────────────────────────────────
         `prefers-reduced-motion` 下不做逐笔绘制：所有描边直接到位、填充直接显示。
         ============================================================ -->
    <style>
      #gw-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #04050a;
        overflow: hidden;
        transition: opacity 0.55s ease;
        will-change: opacity;
      }
      #gw-boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      /* 淡出期间冻结层内所有动画（2026-10-26 性能体检）：
         此时同时还在跑的有 —— 星空呼吸(7s)、镜头呼吸(6s)、扫光(1.3s)、
         进度条(1.6s)、上色/外辉过渡。全屏层淡出 + 5 个合成动画一起烧，
         实测就是「交接那一瞬间卡一下」。冻结后只剩一次 opacity 过渡。 */
      #gw-boot.is-done,
      #gw-boot.is-done::before,
      #gw-boot.is-done * {
        animation-play-state: paused !important;
      }

      /* ── 专门衔接镜头（2026-10-26 主人要求「结尾必须留专门的入口」）────
         整轮画完（扫光收笔）→ splash.ts 的 GSAP 时间轴打 is-done →
         这 0.55s 里发生三件事，与后面的 WebGL 拉远首尾相接：
         ① 手绘土星轻推近 5.5%（transform 合成器属性）—— 与后面悬停的
            WebGL 土星同向运动，视线被「递」过去，不是被掐断；
         ② 进度条收束走满、定格成一条满格实线 —— 与计数冲 100 同拍；
         ③ 整层淡出，露出已经 2.05 倍悬停的真土星。
         注意：is-done 已把层内动画全部 paused，但 paused 的动画仍占据属性，
         必须 animation:none 彻底摘掉，过渡才能接管。 */
      #gw-boot.is-done .gw-draw {
        animation: none;
        transform: scale(1.055);
        transition: transform 0.55s cubic-bezier(0.33, 0, 0.2, 1);
      }
      #gw-boot.is-done .gw-boot-bar > i {
        animation: none;
        width: 100%;
        transform: none;
        background: linear-gradient(90deg, rgba(143, 183, 255, 0.5), rgba(143, 183, 255, 0.95), rgba(143, 183, 255, 0.5));
        transition: width 0.45s cubic-bezier(0.33, 0, 0.2, 1);
      }

      /* 核心光晕（2026-10-26 性能体检）：主线程被主包求值堵死的那 1~1.6 秒里，
         JS 动画（逐笔描边）与所有 paint 类动画都会冻住 —— 只留「合成器属性」
         （transform / opacity）还在动。这一层就是给那段冻结兜底的：
         呼吸只改 opacity + scale，纯合成器驱动，主线程完全堵住也照常脉动。
         用户看到的画面因此永远是「活的」，而不是「定住的一帧」。 */
      .gw-aura{
        position:absolute;left:50%;top:50%;width:78vh;height:78vh;max-width:82vw;max-height:82vw;
        transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
        background:radial-gradient(circle,rgba(243,222,186,.11) 0 40%,rgba(243,222,186,.045) 56%,transparent 72%);
        animation:gw-aura 3.4s ease-in-out infinite;
        will-change:transform,opacity;
      }
      @keyframes gw-aura{
        0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(.95)}
        50%{opacity:.92;transform:translate(-50%,-50%) scale(1.05)}
      }

      /* 星空：多层径向渐变点阵，缓慢呼吸 */
      #gw-boot::before {
        content: '';
        position: absolute;
        inset: -10%;
        background-image:
          radial-gradient(1.6px 1.6px at 18% 22%, rgba(214, 228, 255, 0.85), transparent 60%),
          radial-gradient(1.4px 1.4px at 72% 14%, rgba(200, 216, 255, 0.7), transparent 60%),
          radial-gradient(1.2px 1.2px at 44% 71%, rgba(255, 240, 220, 0.55), transparent 60%),
          radial-gradient(1.8px 1.8px at 86% 62%, rgba(214, 228, 255, 0.75), transparent 60%),
          radial-gradient(1.2px 1.2px at 28% 86%, rgba(200, 216, 255, 0.5), transparent 60%),
          radial-gradient(1.4px 1.4px at 60% 40%, rgba(236, 244, 255, 0.45), transparent 60%);
        background-size: 340px 340px, 430px 430px, 300px 300px, 520px 520px, 380px 380px, 470px 470px;
        opacity: 0.5;
        animation: gw-stars 7s ease-in-out infinite;
      }
      @keyframes gw-stars {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.66; }
      }

      /* 绘制层：SVG 尺寸与后面 WebGL 的构图对齐（环跨度 ≈ 视口高度） */
      .gw-draw {
        position: relative;
        width: 99vh;
        height: 99vh;
        max-width: 96vw;
        max-height: 96vw;
      }
      .gw-draw svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* 所有描边：长度归一化为 1，靠 dashoffset 推出来。
         ── 兜底期（JS 未接管）不画土星（2026-10-26 13:21 主人实测反馈）──
         旧版兜底是一条 5.2s 的「画→上色→扫光→擦除」CSS 循环，结果用户看到的是
         三段式：CSS 画了半圈 → 主包求值把主线程堵死画面冻住 → boot.js 接管
         归零从头重画。即「绘制一下、卡一下、重新开始绘制」。
         现在兜底期只留空纸 + 光晕呼吸 + 星空 + 进度条（全部 transform/opacity
         合成器动画，主线程堵死也照常动）；描边保持 dashoffset:1 隐藏。
         全片只有 JS 接管后那一次真画 —— 从第一笔到收笔没有第二次。
         JS 完全失效（boot.js 没到）时画面是「静态但活」的等待页，与 aura 层
         的设计哲学一致（§31 性能口径）。 */
      .gw-draw .line {
        fill: none;
        stroke: rgba(238, 228, 204, 0.92);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0.9;
      }
      /* 画完后的「上色」：球体渐变淡入、描边退淡、外辉亮起。
         只由 JS 接管后按 class 单次触发（is-drawn），没有 CSS 循环版。 */
      .gw-draw .fill {
        opacity: 0;
      }
      html[data-bootjs] .gw-draw.is-drawn .fill {
        opacity: 1;
        transition: opacity 0.9s ease;
      }
      .gw-draw .glow {
        opacity: 0;
      }
      html[data-bootjs] .gw-draw.is-drawn .glow {
        opacity: 0.6;
        transition: opacity 1.1s ease;
      }


      /* ── 电影片头的两件东西（2026-10-26 01:12 主人：「做得有故事一点，
            类似电影开屏 logo」）────────────────────────────
         ① 镜头呼吸：整个画面 6s 里极缓慢地 1 → 1.035 → 1。
            这不是装饰 —— 静止的画面会让「绘制」看起来像一张图在变；
            有了极轻的推拉，眼睛读到的才是「镜头在拍一个东西」。
         ② 扫光：一道斜向高光在「上色完成」那一刻掠过（JS 触发一次）。
            只动 transform，不改背景位置，GPU 合成，几乎零成本。 */
      /* 镜头呼吸：整个画面极缓慢地 1 → 1.035 → 1（6s 一拍，transform 合成器）。
         这不是装饰 —— 静止的画面会让「绘制」看起来像一张图在变；
         有了极轻的推拉，眼睛读到的才是「镜头在拍一个东西」。
         接管前后同一时长（6s）：中途改 duration 会让动画相位跳变。 */
      .gw-draw {
        animation: gw-cam 6s ease-in-out infinite;
      }
      @keyframes gw-cam {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.035); }
      }
      .gw-sweep {
        position: absolute;
        inset: -20%;
        pointer-events: none;
        background: linear-gradient(
          104deg,
          transparent 38%,
          rgba(255, 250, 235, 0.05) 46%,
          rgba(255, 250, 235, 0.16) 50%,
          rgba(255, 250, 235, 0.05) 54%,
          transparent 62%
        );
        mix-blend-mode: screen;
        opacity: 0;
      }
      /* 扫光只由 JS 触发：「画完上色」那一刻的一次性掠过，没有周期彩排版 */
      html[data-bootjs] .gw-draw.is-swept .gw-sweep {
        animation: gw-sweep-once 1.3s ease-in-out forwards;
      }
      @keyframes gw-sweep-once {
        0% { opacity: 0; transform: translateX(-58%); }
        18% { opacity: 0.9; }
        100% { opacity: 0; transform: translateX(58%); }
      }

      /* 底部：不定进度条 + 文案 */
      .gw-boot-foot {
        position: absolute;
        left: 50%;
        bottom: 6vh;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .gw-boot-bar {
        position: relative;
        width: 176px;
        height: 2px;
        border-radius: 2px;
        background: rgba(140, 152, 178, 0.18);
        overflow: hidden;
      }
      .gw-boot-bar > i {
        position: absolute;
        top: 0;
        left: 0;
        width: 34%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(143, 183, 255, 0), rgba(143, 183, 255, 0.9), rgba(143, 183, 255, 0));
        animation: gw-bar 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes gw-bar {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(310%); }
      }
      .gw-boot-tip {
        font: 11.5px/1 system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: #7f8a9e;
        letter-spacing: 0.18em;
        white-space: nowrap;
        font-variant-numeric: tabular-nums; /* 计数跳动时数字宽度不抖 */
      }
      /* 百分比（boot.ts 注入）。比文案亮半档，是这一行里真正「在说话」的部分 */
      .gw-boot-tip .gw-boot-pct {
        color: #b9c2d4;
      }

      /* WebGL 接管后的「加载中」横幅（由 splash.ts 显示/收回） */
      #gw-hint {
        position: fixed;
        left: 50%;
        bottom: 48px;
        z-index: 9998;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        border-radius: 999px;
        background: rgba(16, 20, 28, 0.74);
        border: 1px solid rgba(140, 152, 178, 0.22);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        font: 12.5px/1 system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: #a9b3c6;
        letter-spacing: 0.06em;
        transform: translateX(-50%);
        transition: opacity 0.32s ease, transform 0.32s ease;
      }
      #gw-hint.is-out {
        opacity: 0;
        transform: translateX(-50%) translateY(6px);
      }
      #gw-hint .gw-hint-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #8fb7ff;
        box-shadow: 0 0 8px rgba(143, 183, 255, 0.7);
        animation: gw-hint-pulse 1.2s ease-in-out infinite;
      }
      @keyframes gw-hint-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }

      /* 减动效：不逐笔，直接呈现成品 */
      @media (prefers-reduced-motion: reduce) {
        #gw-boot::before,
        .gw-aura,
        .gw-boot-bar > i,
        #gw-hint .gw-hint-dot {
          animation: none;
        }
        .gw-draw,
        .gw-sweep,
        .gw-draw .line {
          animation: none;
        }
        .gw-draw .line {
          stroke-dashoffset: 0;
        }
        .gw-sweep {
          opacity: 0;
        }
        .gw-draw .fill,
        .gw-draw .glow {
          animation: none;
          opacity: 1;
        }
        .gw-boot-bar > i {
          width: 100%;
          background: rgba(143, 183, 255, 0.45);
        }
        /* 减动效下连衔接镜头的推近/进度过渡也不做（is-done 规则被这里的
           后置同名规则覆盖：transform 恒 1、宽度恒满、零过渡） */
        #gw-boot.is-done .gw-draw {
          animation: none;
          transform: none;
          transition: none;
        }
        #gw-boot.is-done .gw-boot-bar > i {
          animation: none;
          width: 100%;
          transform: none;
          transition: none;
        }
        #gw-boot,
        #gw-hint {
          transition: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DKwj2ByN.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-1sJyTj51.css">
  </head>
  <body>
    <div id="gw-boot" aria-hidden="true">
      <div class="gw-aura" aria-hidden="true"></div>
      <div class="gw-draw">
        <div class="gw-sweep" aria-hidden="true"></div>
        <!-- 400×400 画布；球 r=85（直径 42.5% → 对齐 WebGL 的 42.8vh），环 rx=198 ry=58（压缩比 0.293） -->
        <svg viewBox="0 0 400 400" role="presentation">
          <defs>
            <radialGradient id="gwPlanet" cx="34%" cy="28%" r="78%">
              <stop offset="0%" stop-color="#fff9ec" />
              <stop offset="15%" stop-color="#f3deba" />
              <stop offset="36%" stop-color="#d7b789" />
              <stop offset="60%" stop-color="#9b7d52" />
              <stop offset="86%" stop-color="#40331f" />
              <stop offset="100%" stop-color="#15100a" />
            </radialGradient>
            <radialGradient id="gwRingGrad" cx="50%" cy="50%" r="50%">
              <stop offset="52%" stop-color="rgba(238,228,204,0.0)" />
              <stop offset="58%" stop-color="rgba(238,228,204,0.55)" />
              <stop offset="72%" stop-color="rgba(214,198,170,0.30)" />
              <stop offset="84%" stop-color="rgba(244,234,210,0.62)" />
              <stop offset="96%" stop-color="rgba(238,228,204,0.26)" />
              <stop offset="100%" stop-color="rgba(238,228,204,0.0)" />
            </radialGradient>
            <clipPath id="gwPlanetClip">
              <circle cx="200" cy="200" r="85" />
            </clipPath>
            <filter id="gwSoft" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="7" />
            </filter>
          </defs>

          <g transform="rotate(-12 200 200)">
            <!-- ① 环的后半段（过球上方） -->
            <path
              class="line l0"
              pathLength="1"
              style="--d: 0.1s"
              d="M 2 200 A 198 58 0 0 1 398 200"
              stroke-width="1.4"
            />
            <!-- ② 球轮廓 -->
            <circle class="line l1" pathLength="1" style="--d: 0.5s" cx="200" cy="200" r="85" />
            <!-- ③ 云带（画在球内，靠 clip 裁掉越界部分） -->
            <circle class="fill" cx="200" cy="200" r="85" fill="url(#gwPlanet)" />
            <g clip-path="url(#gwPlanetClip)">
              <path class="line l2" pathLength="1" style="--d: 0.95s" d="M 110 168 Q 200 156 290 168" stroke-width="1.5" />
              <path class="line l3" pathLength="1" style="--d: 1.08s" d="M 108 200 Q 200 192 292 200" stroke-width="1.9" />
              <path class="line l4" pathLength="1" style="--d: 1.21s" d="M 110 232 Q 200 224 290 232" stroke-width="1.5" />
              <path class="line l5" pathLength="1" style="--d: 1.32s" d="M 118 258 Q 200 250 282 258" stroke-width="1.1" />
            </g>
            <!-- ④ 球体填充（画完再上色） -->
            <!-- ⑤ 环的前半段（过球下方，最后画，土星这才「穿过」环） -->
            <path
              class="line l6"
              pathLength="1"
              style="--d: 1.38s"
              d="M 398 200 A 198 58 0 0 1 2 200"
              stroke-width="1.7"
            />
            <!-- 环的填充（细椭圆环带，在描边之上补一点实体感） -->
            <ellipse
              class="fill"
              cx="200"
              cy="200"
              rx="198"
              ry="58"
              fill="none"
              stroke="url(#gwRingGrad)"
              stroke-width="15"
              opacity="0"
            />
            <!-- ⑥ 高光弧 -->
            <path
              class="line l7"
              pathLength="1"
              style="--d: 1.5s"
              d="M 148 148 A 85 85 0 0 1 206 116"
              stroke="rgba(255,252,244,0.9)"
              stroke-width="2.2"
            />
          </g>

          <!-- 外辉：模糊的一圈，让「画完」之后有光 -->
          <circle class="glow" cx="200" cy="200" r="92" fill="rgba(243,222,186,0.16)" filter="url(#gwSoft)" />
        </svg>
      </div>

      <div class="gw-boot-foot">
        <div class="gw-boot-bar"><i></i></div>
        <div class="gw-boot-tip">正在加载工作台</div>
      </div>
    </div>

    <div id="gw-hint" hidden aria-live="polite">
      <span class="gw-hint-dot"></span>
      <span>正在加载工作台…</span>
    </div>
    <div id="root"></div>
    <!-- 开屏动画 JS（CONTRACT §31）：public/boot.js 原样进产物、不进打包器。
         classic script 同步执行、几 KB，与 2.3MB 主包并行下载、秒到秒播。
         不能改成 type="module"：Vite 会把同页多个 module 脚本合并进同一个
         entry chunk，「先到先播」就落空了（实测踩过）。 -->
    <script src="/boot.js"></script>
  </body>
</html>
